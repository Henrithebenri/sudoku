<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Sudoku">
<meta name="theme-color" content="#eef1f4"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><title>Sudoku</title>
<style>
:root{--bg:#eef1f4;--cd:#fff;--tx:#14202b;--mu:#64748b;--ac:#0f766e;--as:#ccfbf1;--rel:#eaf0f5;--sm:#99e6dc;--er:#dc2626;--es:#fee2e2;--ln:#1e293b;--th:#cbd5e1;--us:#0f766e}
@media(prefers-color-scheme:dark){:root{--bg:#0b1117;--cd:#151e27;--tx:#e8eef4;--mu:#8fa0b2;--ac:#2dd4bf;--as:#134e4a;--rel:#1b2733;--sm:#1d6b66;--er:#f87171;--es:#4c1d1d;--ln:#cbd5e1;--th:#334155;--us:#5eead4}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px ui-rounded,-apple-system,system-ui,sans-serif;overscroll-behavior:none}
.scr{height:100%;display:flex;flex-direction:column;max-width:520px;margin:auto;padding:max(env(safe-area-inset-top),12px) 14px max(env(safe-area-inset-bottom),12px);overflow-y:auto}
[hidden]{display:none!important}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1{font-size:44px;margin:24px 0 4px;letter-spacing:-1.5px}h2{font-size:15px;margin:22px 0 8px;color:var(--mu);font-weight:600}
.sub{color:var(--mu);margin:0 0 8px}
.lv{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 18px;margin-bottom:8px;border-radius:14px;background:var(--cd);font-weight:600;font-size:18px;text-align:left}
.lv small{color:var(--mu);font-weight:400;font-size:13px}.lv.pr{background:var(--ac);color:var(--bg)}.lv.pr small{color:inherit;opacity:.8}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--th)}
.row input{width:46px;height:28px;accent-color:var(--ac)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:4px 0}.bar b{font-variant-numeric:tabular-nums}
.bar button{color:var(--ac);font-weight:600;padding:8px 4px}.mid{text-align:center;line-height:1.2}.mid small{color:var(--mu);display:block}
#bd{display:grid;grid-template-columns:repeat(9,1fr);width:var(--b);height:var(--b);--b:min(calc(100vw - 28px),calc(100dvh - 300px),500px);margin:8px auto;border:2px solid var(--ln);border-radius:8px;overflow:hidden;background:var(--cd)}
.c{display:flex;align-items:center;justify-content:center;font-size:calc(var(--b)/13);font-variant-numeric:tabular-nums;border:.5px solid var(--th);color:var(--us)}
.c:nth-child(9n+3),.c:nth-child(9n+6){border-right:2px solid var(--ln)}
.c:nth-child(n+19):nth-child(-n+27),.c:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--ln)}
.c.g{color:var(--tx);font-weight:700}.c.r{background:var(--rel)}.c.m{background:var(--as)}.c.s{background:var(--sm)}.c.e{color:var(--er);background:var(--es)}
.nt{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%;font-size:calc(var(--b)/38);color:var(--mu);font-weight:600;text-align:center;align-items:center}
.tools{display:flex;gap:8px;margin:6px 0}.tools button{flex:1;padding:10px 0;border-radius:12px;background:var(--cd);font-size:13px;color:var(--mu)}
.tools button b{display:block;font-size:20px;color:var(--tx);font-weight:500}.tools button.on{background:var(--ac)}.tools button.on,.tools button.on b{color:var(--bg)}
#pad{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:4px}
#pad button{padding:8px 0 6px;border-radius:10px;background:var(--cd);font-size:26px;color:var(--ac);font-weight:600;line-height:1}
#pad button small{display:block;font-size:11px;color:var(--mu);font-weight:400;margin-top:3px}#pad button.d{opacity:.25;pointer-events:none}
#md{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:24px}
#md div{background:var(--cd);border-radius:20px;padding:24px;width:100%;max-width:340px;text-align:center}#md h3{margin:0 0 8px;font-size:26px}#md p{color:var(--mu);margin:0 0 16px;line-height:1.5}
</style></head><body>
<main id="menu" class="scr"><h1>Sudoku</h1><p class="sub">Läuft komplett offline.</p>
<button class="lv pr" id="cont" hidden></button><h2>Neues Spiel</h2><div id="lvs"></div>
<h2>Statistik</h2><div id="stats"></div><h2>Einstellungen</h2>
<label class="row">Fehler sofort markieren<input type="checkbox" id="cErr"></label>
<label class="row">Spiel nach 3 Fehlern beenden<input type="checkbox" id="cLim"></label></main>
<main id="game" class="scr" hidden><div class="bar"><button id="back">‹ Menü</button><div class="mid"><b id="lt"></b><small id="tm"></small></div><b id="er"></b></div>
<div id="bd"></div>
<div class="tools"><button id="undo"><b>↶</b>Zurück</button><button id="del"><b>⌫</b>Löschen</button><button id="note"><b>✎</b>Notizen</button><button id="hint"><b>✦</b>Tipp</button></div>
<div id="pad"></div></main><div id="md" hidden></div>
<script>
const $=s=>document.querySelector(s),LV={leicht:[40,'Leicht'],mittel:[34,'Mittel'],schwer:[29,'Schwer'],experte:[25,'Experte']};
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let S=ld('sdk',null),ST=ld('sdkst',{}),CF=ld('sdkcf',{err:true,lim:true}),nm=false;
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const bx=i=>(i/27|0)*3+(i%9/3|0),rel=(a,b)=>(a/9|0)===(b/9|0)||a%9===b%9||bx(a)===bx(b),fm=t=>(t/60|0)+':'+String(t%60).padStart(2,'0');
function solve(g,lim){let n=0,sol=null;const R=Array(9).fill(0),C=Array(9).fill(0),B=Array(9).fill(0);
 for(let i=0;i<81;i++)if(g[i]){const b=1<<g[i];R[i/9|0]|=b;C[i%9]|=b;B[bx(i)]|=b}
 (function rec(){let bi=-1,bm=0,bc=10;
  for(let i=0;i<81;i++)if(!g[i]){const m=~(R[i/9|0]|C[i%9]|B[bx(i)])&0x3FE;let c=0,t=m;while(t){t&=t-1;c++}if(c<bc){bc=c;bi=i;bm=m;if(c<2)break}}
  if(bi<0){n++;if(!sol)sol=g.slice();return}if(!bc)return;
  const r=bi/9|0,c=bi%9,b=bx(bi),ds=[];for(let d=1;d<10;d++)if(bm>>d&1)ds.push(d);
  for(const d of sh(ds)){const k=1<<d;g[bi]=d;R[r]|=k;C[c]|=k;B[b]|=k;rec();g[bi]=0;R[r]&=~k;C[c]&=~k;B[b]&=~k;if(n>=lim)return}})();
 return[n,sol]}
function gen(lv){const sol=solve(Array(81).fill(0),1)[1],p=sol.slice();let cl=81;
 for(const i of sh([...Array(81).keys()])){if(cl<=LV[lv][0])break;const v=p[i];p[i]=0;if(solve(p.slice(),2)[0]!==1)p[i]=v;else cl--}
 return{lv,sol,giv:p.slice(),cur:p.slice(),nt:Array(81).fill(0),t:0,er:0,hn:0,hist:[],done:false,sel:-1}}
function start(lv){$('#md').hidden=false;$('#md').innerHTML='<div><h3>Einen Moment …</h3><p>Rätsel wird erzeugt.</p></div>';
 setTimeout(()=>{S=gen(lv);sv('sdk',S);$('#md').hidden=true;open()},30)}
function open(){$('#menu').hidden=true;$('#game').hidden=false;S.sel=-1;$('#lt').textContent=LV[S.lv][1];render()}
function menu(){$('#game').hidden=true;$('#menu').hidden=false;
 $('#cont').hidden=!S||S.done;if(S&&!S.done)$('#cont').innerHTML='Fortsetzen<small>'+LV[S.lv][1]+' · '+fm(S.t)+'</small>';
 $('#lvs').innerHTML=Object.entries(LV).map(([k,v])=>`<button class="lv" data-l="${k}">${v[1]}<small>${v[0]} Hinweise</small></button>`).join('');
 $('#stats').innerHTML=Object.entries(LV).map(([k,v])=>{const s=ST[k]||{w:0,b:0};return`<div class="row"><span>${v[1]}</span><span>${s.w} gewonnen · Bestzeit ${s.b?fm(s.b):'–'}</span></div>`}).join('');
 $('#cErr').checked=CF.err;$('#cLim').checked=CF.lim}
function render(){const cs=$('#bd').children,sl=S.sel,sn=sl>=0?S.cur[sl]:0,cnt=Array(10).fill(0);
 for(let i=0;i<81;i++){const c=cs[i],v=S.cur[i];if(v)cnt[v]++;let k='c';
  if(S.giv[i])k+=' g';if(i===sl)k+=' s';else if(sl>=0&&rel(i,sl))k+=' r';
  if(v&&v===sn&&i!==sl)k+=' m';if(v&&!S.giv[i]&&CF.err&&v!==S.sol[i])k+=' e';c.className=k;
  const key=v||'n'+S.nt[i];if(c._k!==key){c._k=key;c.innerHTML=v||(S.nt[i]?'<div class="nt">'+[1,2,3,4,5,6,7,8,9].map(d=>'<span>'+(S.nt[i]>>d&1?d:'')+'</span>').join('')+'</div>':'')}}
 [...$('#pad').children].forEach((b,i)=>{b.lastChild.textContent=9-cnt[i+1]>0?9-cnt[i+1]:'';b.classList.toggle('d',cnt[i+1]>=9)});
 $('#er').textContent='Fehler '+S.er+(CF.lim?'/3':'');$('#tm').textContent=fm(S.t);$('#note').classList.toggle('on',nm)}
const snap=()=>{S.hist.push([S.cur.slice(),S.nt.slice()]);if(S.hist.length>300)S.hist.shift()},ok=i=>S.cur[i]&&S.cur[i]===S.sol[i];
function put(n,i=S.sel){if(S.done||i<0||S.giv[i]||ok(i))return;
 if(nm){if(S.cur[i])return;snap();S.nt[i]^=1<<n}
 else{snap();if(S.cur[i]===n)S.cur[i]=0;else{S.cur[i]=n;S.nt[i]=0;if(n!==S.sol[i])S.er++;else for(let j=0;j<81;j++)if(rel(i,j))S.nt[j]&=~(1<<n)}}
 after()}
function after(){sv('sdk',S);render();
 if(S.cur.every((v,i)=>v===S.sol[i])){S.done=true;sv('sdk',S);const s=ST[S.lv]||{w:0,b:0};s.w++;if(!s.b||S.t<s.b)s.b=S.t;ST[S.lv]=s;sv('sdkst',ST);
  modal('Geschafft!',`${LV[S.lv][1]} in ${fm(S.t)} gelöst.<br>${S.er} Fehler, ${S.hn} Tipps.`,1)}
 else if(CF.lim&&S.er>=3){S.done=true;sv('sdk',S);modal('Verloren','Du hast 3 Fehler gemacht.',1)}}
function modal(h,p,end){$('#md').hidden=false;$('#md').innerHTML=`<div><h3>${h}</h3><p>${p}</p><button class="lv pr" id="ok">${end?'Zum Menü':'OK'}</button></div>`;
 $('#ok').onclick=()=>{$('#md').hidden=true;if(end)menu()}}
$('#bd').innerHTML=Array.from({length:81},(_, i)=>`<div class="c" data-i="${i}"></div>`).join('');
$('#pad').innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}<small></small></button>`).join('');
$('#bd').onclick=e=>{const c=e.target.closest('.c');if(c&&S){S.sel=+c.dataset.i;render()}};
$('#pad').onclick=e=>{const b=e.target.closest('button');if(b)put(+b.dataset.n)};
$('#undo').onclick=()=>{if(S.done||!S.hist.length)return;[S.cur,S.nt]=S.hist.pop();after()};
$('#del').onclick=()=>{const i=S.sel;if(S.done||i<0||S.giv[i]||ok(i)||(!S.cur[i]&&!S.nt[i]))return;snap();S.cur[i]=0;S.nt[i]=0;after()};
$('#note').onclick=()=>{nm=!nm;render()};
$('#hint').onclick=()=>{if(S.done)return;let i=S.sel;if(i<0||S.giv[i]||ok(i))i=sh([...Array(81).keys()].filter(j=>S.cur[j]!==S.sol[j]))[0];
 if(i===undefined)return;snap();S.cur[i]=S.sol[i];S.nt[i]=0;S.hn++;S.sel=i;for(let j=0;j<81;j++)if(rel(i,j))S.nt[j]&=~(1<<S.sol[i]);after()};
$('#back').onclick=()=>{sv('sdk',S);menu()};$('#cont').onclick=open;
$('#lvs').onclick=e=>{const b=e.target.closest('button');if(b)start(b.dataset.l)};
$('#cErr').onchange=e=>{CF.err=e.target.checked;sv('sdkcf',CF)};$('#cLim').onchange=e=>{CF.lim=e.target.checked;sv('sdkcf',CF)};
setInterval(()=>{if(S&&!S.done&&!document.hidden&&!$('#game').hidden){S.t++;$('#tm').textContent=fm(S.t);if(S.t%10==0)sv('sdk',S)}},1000);
document.addEventListener('visibilitychange',()=>{if(S)sv('sdk',S)});
menu();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
